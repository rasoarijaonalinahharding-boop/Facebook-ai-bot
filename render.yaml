services:
  - type: web
    name: facebook-ai-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: XAI_API_KEY
        sync: false
      - key: PAGE_ACCESS_TOKEN
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: XAI_MODEL
        value: grok-4.7
      - key: XAI_IMAGE_MODEL
        value: grok-imagine-image-2.0
      - key: XAI_VIDEO_MODEL
        value: grok-imagine-video-1.5
      - key: XAI_VOICE_ID
        value: eve
      - key: FB_API_VERSION
        value: v26.0
